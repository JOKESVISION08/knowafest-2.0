    <script>
      // Suppress Vite HMR WebSocket connection closed notices in AI Studio preview
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && String(e.reason).toLowerCase().includes('websocket')) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        if (e && (String(e.message).toLowerCase().includes('websocket') || String(e.error).toLowerCase().includes('websocket'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
    <title>KnowaFest Explorer - College Symposium & Events Directory</title>
    <meta name="description" content="KnowaFest Explorer - Search collegiate technical symposiums, hackathons, and workshops by location with live updates and direct details from KnowaFest.com." />
    <meta property="og:title" content="KnowaFest Explorer - College Symposium & Events Directory" />
    <meta property="og:description" content="Search collegiate technical symposiums, hackathons, and workshops by location with live updates and direct details from KnowaFest.com." />
